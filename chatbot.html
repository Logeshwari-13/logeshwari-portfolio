<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logeshwari AI Chatbot</title>

    <link rel="stylesheet" href="chatbot.css">
</head>

<body>

    <div class="chatbot">

        <div class="chat-header">
            <div>
                <h2>🤖 Logeshwari AI</h2>
                <p>Ask me about my portfolio</p>
            </div>

            <button onclick="window.close()">✕</button>
        </div>

        <div class="chat-messages" id="chat-messages">

            <div class="message bot">
                <p>
                    Hi! 👋 I'm Logeshwari's AI assistant.
                    You can ask me about my skills, education,
                    internship, projects, certifications, or experience.
                </p>
            </div>

        </div>

        <div class="chat-input">

            <input
                type="text"
                id="user-input"
                placeholder="Type your question..."
            >

            <button onclick="sendMessage()">Send</button>

        </div>

    </div>

    <script>
        function sendMessage() {

            const input = document.getElementById("user-input");
            const message = input.value.trim();

            if (message === "") {
                return;
            }

            const chatMessages =
                document.getElementById("chat-messages");

            // User message
            const userMessage = document.createElement("div");
            userMessage.className = "message user";

            userMessage.innerHTML = `<p>${message}</p>`;

            chatMessages.appendChild(userMessage);

            input.value = "";

            // Temporary bot response
            const botMessage = document.createElement("div");
            botMessage.className = "message bot";

            botMessage.innerHTML =
                "<p>Thanks for your question! 🤖 AI connection will be added next.</p>";

            chatMessages.appendChild(botMessage);

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>

</body>
</html>
